<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM 客户管理系统 · 线索管控模块</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 侧边导航 -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">CRM</div>
      <div class="logo-text">
        <div class="logo-title">客户管理系统</div>
        <div class="logo-sub">线索管控平台</div>
      </div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-footer">
      <div class="tip-box">
        <div class="tip-title">数据说明</div>
        <div class="tip-text">演示数据保存在浏览器本地，可点击下方按钮恢复初始数据。</div>
        <button class="btn btn-ghost btn-sm btn-block" id="btn-reset">重置演示数据</button>
      </div>
    </div>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">线索池</h1>
        <span id="page-date" class="page-date"></span>
      </div>
      <div class="topbar-right">
        <span class="role-hint">切换身份体验不同权限：</span>
        <select id="user-switch" class="user-switch"></select>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast-root"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
